[book]
title = "Agent Birthbook"
description = "The reference architecture for autonomous agent provisioning."
authors = ["Agent Birthbook contributors"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false
extra-watch-dirs = ["po"]

[preprocessor.gettext]
after = ["links"]
before = ["mermaid"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/MatrixA/agent-birthbook"
edit-url-template = "https://github.com/MatrixA/agent-birthbook/edit/main/{path}"
additional-css = ["assets/language-switcher.css"]
additional-js = ["assets/mermaid.min.js", "assets/mermaid-init.js", "assets/language-switcher.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
