name: Review docs

on:
  pull_request:
    paths: ["docs/**"]
  workflow_dispatch:
    inputs:
      path:
        description: "Docs path to review (file or directory)"
        default: docs

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: docs-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # fork PRs have no secrets; skip rather than fail red
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_URL: ${{ secrets.NTFY_URL }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      REVIEW_PATH: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y mdbook mdbook-mermaid
      - run: npx -y playwright install --with-deps chromium
      - run: npm i -g @anthropic-ai/claude-code

      - name: Review with DeepSeek agent
        # Claude Code CLI pointed at DeepSeek's Anthropic-compatible endpoint;
        # env values per https://api-docs.deepseek.com/quick_start/agent_integrations/claude_code
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-flash[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-flash
        run: |
          claude -p "$(cat .github/docs-review.md)" \
            --allowedTools "Bash,Read,Write,Glob,Grep,WebFetch" \
            --output-format text
          [ -s review.md ] || { echo "agent produced no review.md"; exit 1; }
          cat review.md

      - name: Post feedback
        run: |
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --body-file review.md --edit-last --create-if-none
            TARGET="PR #$PR"; LINK=${{ github.event.pull_request.html_url }}
          else
            LINK=$(gh issue create --title "Docs review: ${{ inputs.path }} ($(date -u +%F))" --body-file review.md)
            TARGET="${{ inputs.path }}"
          fi
          echo "LINK=$LINK" >> "$GITHUB_ENV"; echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Notify ntfy
        if: env.NTFY_URL != ''
        run: |
          curl -sSf -H "Title: Docs review: $TARGET" -H "Click: $LINK" \
            --data-binary "$(head -c 800 review.md)" "$NTFY_URL"
